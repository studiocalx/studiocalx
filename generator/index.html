<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Calx - Interactive Director's Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .wireframe-mode {
      filter: grayscale(100%) contrast(120%);
      font-family: 'Courier New', Courier, monospace !important;
    }
    .wireframe-mode * {
      background-color: #f8fafc !important;
      color: #334155 !important;
      border-color: #94a3b8 !important;
      box-shadow: none !important;
      border-style: dashed !important;
    }
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white">C</div>
      <span class="font-bold tracking-wider text-lg">Studio Calx <span class="text-xs text-indigo-400 font-normal px-2 py-0.5 border border-indigo-500/30 rounded-full">Director's Tool</span></span>
    </div>
    <div class="flex items-center space-x-4">
      <button id="wireframeToggle" onclick="toggleWireframe()" class="px-3 py-1.5 text-xs font-medium rounded-md border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
        <i class="fa-solid fa-border-top-left mr-1.5"></i>ワイヤーフレーム表示: <span id="wfStatus" class="text-indigo-400">OFF</span>
      </button>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-0 overflow-hidden">

    <!-- Left Control Panel (商談ナビゲート用ヒアリングシート) -->
    <section class="lg:col-span-4 bg-slate-950 border-r border-slate-800 p-6 overflow-y-auto max-h-[calc(100vh-65px)]">
      <div class="mb-6">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-indigo-400 mb-1">Step 1. 要件のヒアリング</h2>
        <p class="text-xs text-slate-400">隣でクライアントと一緒に選びながら、構成を決定します。</p>
      </div>

      <form id="simulatorForm" onsubmit="event.preventDefault(); updatePreview();" class="space-y-5 text-sm">
        <!-- 屋号 -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">屋号・サービス名</label>
          <input type="text" id="brandName" value="Calx Coffee Roasters" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>

        <!-- 業種（画像タグ連動） -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">業種カテゴリー（画像ストック連動）</label>
          <select id="industry" onchange="updatePreview()" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
            <option value="cafe">飲食・カフェ (Cafe / Dining)</option>
            <option value="b2b">IT・B2Bサービス (SaaS / Corporate)</option>
            <option value="salon">美容・サロン (Beauty / Salon)</option>
          </select>
        </div>

        <!-- サイトの目的（構造・導線が激変する設定） -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Webサイトの最優先目的（CV導線）</label>
          <select id="goal" onchange="updatePreview()" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
            <option value="store">店舗来店・ネット予約の獲得（予約特化型）</option>
            <option value="lead">B2Bリード獲得・資料請求（信頼重視型）</option>
            <option value="lp">単一商品・キャンペーン販売（オファー強打型）</option>
          </select>
        </div>

        <!-- 訴求コピー -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">メインキャッチコピー</label>
          <textarea id="catchphrase" rows="2" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">静寂と、一杯の至福を。</textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg text-white transition shadow-lg shadow-indigo-600/20">
          <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>構成＆デザインを更新する
        </button>
      </form>

      <!-- 診断・提案アドバイスカード -->
      <div class="mt-8 p-4 rounded-xl border border-indigo-500/20 bg-indigo-950/20 text-xs space-y-2">
        <div class="flex items-center text-indigo-400 font-semibold">
          <i class="fa-solid fa-lightbulb mr-2"></i>ディレクターズ・ノーツ
        </div>
        <p id="directorAdvice" class="text-slate-300 leading-relaxed">
          店舗型サイトでは、ファーストビューでの空間認知と「予約ボタン」への常駐導線がコンバージョン率（CVR）を左右します。
        </p>
      </div>
    </section>

    <!-- Right Preview Canvas (即座に見せる画面) -->
    <section class="lg:col-span-8 bg-slate-900 p-6 flex flex-col justify-between overflow-y-auto max-h-[calc(100vh-65px)]">
      <div id="previewContainer" class="bg-white text-slate-800 rounded-xl shadow-2xl overflow-hidden border border-slate-700 transition-all duration-300 fade-in">
        <!-- プレビューコンテンツがここにJSで挿入されます -->
      </div>
    </section>

  </main>

  <script>
    // 業種ごとのタグ付きストック画像データベース
    const imageStock = {
      cafe: [
        "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1200&q=80",
        "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80"
      ],
      b2b: [
        "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=80",
        "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80"
      ],
      salon: [
        "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1200&q=80",
        "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1200&q=80"
      ]
    };

    let isWireframe = false;

    function toggleWireframe() {
      isWireframe = !isWireframe;
      const container = document.getElementById('previewContainer');
      const statusText = document.getElementById('wfStatus');
      
      if (isWireframe) {
        container.classList.add('wireframe-mode');
        statusText.innerText = "ON (骨組み表示)";
      } else {
        container.classList.remove('wireframe-mode');
        statusText.innerText = "OFF (デザイン表示)";
      }
    }

    function updatePreview() {
      const name = document.getElementById('brandName').value || 'Studio Calx';
      const ind = document.getElementById('industry').value;
      const goal = document.getElementById('goal').value;
      const copy = document.getElementById('catchphrase').value;
      
      const images = imageStock[ind] || imageStock.cafe;
      const adviceEl = document.getElementById('directorAdvice');
      const preview = document.getElementById('previewContainer');

      let sectionsHTML = '';

      // 目的（Goal）に応じた構造（セクション順序と機能）のダイナミック構築
      if (goal === 'store') {
        adviceEl.innerText = "【店舗・来店型導線】空間・商品のスライダー写真で魅了し、常駐するWEB予約ボタンへスムーズに誘導する「直感重視」のレイアウトです。";
        sectionsHTML = `
          <!-- Hero Section with Slider Image -->
          <div class="relative h-96 bg-cover bg-center transition-all duration-500 flex items-center justify-center text-white text-center p-6" style="background-image: url('${images[0]}')">
            <div class="absolute inset-0 bg-black/50"></div>
            <div class="relative z-10 max-w-xl">
              <span class="text-xs uppercase tracking-widest bg-indigo-600/80 px-3 py-1 rounded-full text-white mb-3 inline-block">Welcome</span>
              <h1 class="text-3xl font-bold mb-2">${name}</h1>
              <p class="text-sm opacity-90">${copy}</p>
              <button class="mt-6 px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg text-sm shadow-md">WEB予約をする</button>
            </div>
          </div>

          <!-- Feature / Gallery -->
          <div class="p-8 bg-slate-50">
            <h2 class="text-xs font-bold uppercase text-indigo-600 tracking-wider mb-2 text-center">Atmosphere</h2>
            <h3 class="text-xl font-bold text-slate-800 text-center mb-6">こだわりの空間と商品</h3>
            <div class="grid grid-cols-2 gap-4 max-w-lg mx-auto">
              <img src="${images[0]}" class="rounded-lg h-32 w-full object-cover shadow">
              <img src="${images[1]}" class="rounded-lg h-32 w-full object-cover shadow">
            </div>
          </div>

          <!-- Access & Reserve CTA -->
          <div class="p-8 text-center bg-white border-t border-slate-100">
            <h3 class="text-lg font-bold text-slate-800 mb-2">営業時間・アクセス</h3>
            <p class="text-xs text-slate-500 mb-4">東京都渋谷区神宮前 1-2-3 / 10:00 - 22:00 (水曜定休)</p>
            <button class="w-full max-w-xs py-3 bg-emerald-600 text-white font-bold rounded-lg shadow-lg">今すぐ空席確認・WEB予約</button>
          </div>
        `;
      } else if (goal === 'lead') {
        adviceEl.innerText = "【B2B・リード獲得型導線】導入事例や実績を上部に配置し、顧客の疑問や不安を解消してから資料請求へ導く「論理・信頼重視」のレイアウトです。";
        sectionsHTML = `
          <!-- Hero Section -->
          <div class="p-10 bg-slate-900 text-white flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="max-w-md">
              <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">B2B Solution</span>
              <h1 class="text-2xl font-bold mt-1 mb-3">${name}</h1>
              <p class="text-xs text-slate-300 leading-relaxed">${copy}</p>
              <div class="mt-6 flex space-x-3">
                <button class="px-4 py-2 bg-indigo-600 text-xs font-semibold rounded-md">資料をダウンロード</button>
                <button class="px-4 py-2 border border-slate-700 text-xs font-semibold rounded-md text-slate-300">無料相談</button>
              </div>
            </div>
            <img src="${images[0]}" class="w-full md:w-64 h-40 object-cover rounded-lg border border-slate-700 shadow-xl">
          </div>

          <!-- Proof / Logos -->
          <div class="p-4 bg-slate-800 text-slate-400 text-center text-xs border-y border-slate-700">
            <span>導入実績 200社突破: 提携パートナー・主要クライアント一覧</span>
          </div>

          <!-- Service Grid -->
          <div class="p-8 bg-slate-50">
            <h3 class="text-lg font-bold text-slate-800 text-center mb-6">選ばれる3つの理由</h3>
            <div class="grid grid-cols-3 gap-4 text-xs text-slate-600">
              <div class="p-4 bg-white rounded-lg shadow-sm border border-slate-200"><strong class="block text-slate-800 mb-1">01. 爆速の導入速度</strong>最短3営業日で運用開始可能。</div>
              <div class="p-4 bg-white rounded-lg shadow-sm border border-slate-200"><strong class="block text-slate-800 mb-1">02. 徹底された安全設計</strong>セキュリティ要件をクリア。</div>
              <div class="p-4 bg-white rounded-lg shadow-sm border border-slate-200"><strong class="block text-slate-800 mb-1">03. 専任伴走サポート</strong>ディレクターが並走。</div>
            </div>
          </div>
        `;
      } else {
        adviceEl.innerText = "【LP・オファー強打型】ファーストビューで強烈なオファー（特典・割引等）を打ち出し、スクロール不要で成果へ繋げる「即時決断型」の構造です。";
        sectionsHTML = `
          <!-- LP Hero -->
          <div class="p-10 bg-amber-500 text-slate-950 text-center relative overflow-hidden">
            <span class="bg-black text-white text-[10px] uppercase font-bold px-3 py-1 rounded-full">期間限定オファー</span>
            <h1 class="text-3xl font-extrabold mt-3 mb-2">${copy}</h1>
            <p class="text-sm font-medium mb-6">【${name}】今だけの特別体験キャンペーン実施中</p>
            <button class="px-8 py-3 bg-black text-white font-bold text-sm rounded-full shadow-2xl hover:scale-105 transition transform">今すぐ特別価格で申し込む</button>
          </div>
          <!-- Benefit -->
          <div class="p-8 bg-white text-center">
            <h3 class="text-md font-bold text-slate-800 mb-4">このオファーで得られる3つのメリット</h3>
            <img src="${images[1]}" class="w-full h-48 object-cover rounded-xl mb-4 shadow">
            <p class="text-xs text-slate-600 max-w-md mx-auto">無駄なコストを徹底削減し、本当に必要な価値だけをダイレクトにお届けします。</p>
          </div>
        `;
      }

      preview.innerHTML = sectionsHTML;
    }

    // 初回実行
    window.onload = () => {
      updatePreview();
    };
  </script>
</body>
</html>
