<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Calx - Director's Proposal Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .wireframe-mode * {
      background-color: #f8fafc !important;
      color: #334155 !important;
      border-color: #cbd5e1 !important;
      box-shadow: none !important;
      font-family: monospace !important;
    }
    .wireframe-mode img {
      filter: grayscale(100%);
      opacity: 0.4;
    }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded bg-indigo-600 flex items-center justify-center font-bold text-white">C</div>
      <span class="font-bold tracking-wider text-sm">Studio Calx <span class="text-xs text-indigo-400 font-normal ml-2 px-2 py-0.5 border border-indigo-500/30 rounded">Proposal Engine</span></span>
    </div>
    <div class="flex items-center space-x-3">
      <button onclick="toggleWireframe()" id="wfBtn" class="px-3 py-1.5 text-xs font-medium rounded border border-slate-700 bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
        <i class="fa-solid fa-border-all mr-1.5"></i>表示切替: <span id="wfLabel" class="text-indigo-400">デザイン案</span>
      </button>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden">

    <!-- Control Panel -->
    <section class="lg:col-span-4 bg-slate-950 border-r border-slate-800 p-6 overflow-y-auto max-h-[calc(100vh-65px)] space-y-5 text-sm">
      <div>
        <h2 class="text-xs font-semibold uppercase tracking-wider text-indigo-400 mb-1">Step 1. 条件設定 & ヒアリング</h2>
        <p class="text-xs text-slate-400">クライアントの目的に合わせた最適な導線構造を選択します。</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">屋号・サービス名</label>
          <input type="text" id="inputName" value="Calx Roasters & Co." oninput="renderPreview()" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">業種カテゴリー</label>
          <select id="inputIndustry" onchange="renderPreview()" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
            <option value="store">飲食・店舗 (Cafe & Restaurant)</option>
            <option value="b2b">B2B・ITサービス (Corporate & SaaS)</option>
            <option value="lp">単一商品・キャンペーン (LP & Offer)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">最優先のCV目的（導線設計）</label>
          <select id="inputGoal" onchange="renderPreview()" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-sm">
            <option value="store">店舗来店・ネット予約獲得</option>
            <option value="lead">資料請求・B2Bリード獲得</option>
            <option value="offer">限定オファー即時申込</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">メインキャッチコピー</label>
          <textarea id="inputCopy" rows="2" oninput="renderPreview()" class="w-full bg-slate-900 border border-slate-800 rounded px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500 text-sm">日常に、上質な深みと寛ぎを。</textarea>
        </div>
      </div>

      <!-- Director's Note -->
      <div class="p-4 rounded border border-indigo-500/20 bg-indigo-950/20 text-xs space-y-2">
        <div class="flex items-center text-indigo-400 font-semibold">
          <i class="fa-solid fa-compass mr-2"></i>ディレクターの選定根拠
        </div>
        <p id="directorNote" class="text-slate-300 leading-relaxed">
          店舗型モデル：ファーストビューでの空間認知と、スマホ画面下部への予約ボタン常駐により、離脱を防ぎ予約完了率を高めます。
        </p>
      </div>
    </section>

    <!-- Preview Canvas -->
    <section class="lg:col-span-8 bg-slate-900 p-6 overflow-y-auto max-h-[calc(100vh-65px)] flex flex-col items-center">
      <div class="w-full max-w-4xl bg-white text-slate-900 rounded-lg shadow-2xl overflow-hidden border border-slate-700 fade-in" id="previewCanvas">
        <!-- 動的プレビューエリア -->
      </div>
    </section>

  </main>

  <script>
    const stockImages = {
      store: [
        "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?auto=format&fit=crop&w=1200&q=80",
        "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=1200&q=80"
      ],
      b2b: [
        "https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1200&q=80",
        "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80"
      ],
      lp: [
        "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=1200&q=80",
        "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=1200&q=80"
      ]
    };

    let isWireframe = false;

    function toggleWireframe() {
      isWireframe = !isWireframe;
      const canvas = document.getElementById('previewCanvas');
      const label = document.getElementById('wfLabel');
      if (isWireframe) {
        canvas.classList.add('wireframe-mode');
        label.innerText = "ワイヤーフレーム (骨組み)";
      } else {
        canvas.classList.remove('wireframe-mode');
        label.innerText = "デザイン案 (プレビュー)";
      }
    }

    function renderPreview() {
      const name = document.getElementById('inputName').value || 'Studio Calx';
      const ind = document.getElementById('inputIndustry').value;
      const goal = document.getElementById('inputGoal').value;
      const copy = document.getElementById('inputCopy').value;
      const note = document.getElementById('directorNote');
      const canvas = document.getElementById('previewCanvas');

      const img = stockImages[ind] || stockImages.store;

      let html = '';

      if (goal === 'store') {
        note.innerText = "【店舗・来店型構造】ビジュアル訴求を最上位に置き、メニューとアクセス、そして直感的なWEB予約導線へとユーザーを迷わず誘導するレイアウトです。";
        html = `
          <div class="relative h-80 bg-cover bg-center flex items-center justify-center text-white text-center p-6" style="background-image: url('${img[0]}')">
            <div class="absolute inset-0 bg-black/60"></div>
            <div class="relative z-10 max-w-xl">
              <span class="text-xs uppercase tracking-widest bg-indigo-600 px-3 py-1 rounded text-white font-semibold">Official Website</span>
              <h1 class="text-3xl font-extrabold mt-2 mb-2">${name}</h1>
              <p class="text-sm text-slate-200 mb-6">${copy}</p>
              <button class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded shadow-lg">WEB空席予約する</button>
            </div>
          </div>
          <div class="p-8 bg-slate-50 border-b border-slate-200">
            <h2 class="text-xs font-bold uppercase tracking-widest text-indigo-600 text-center mb-1">Concept & Gallery</h2>
            <h3 class="text-lg font-bold text-slate-800 text-center mb-6">空間とこだわり</h3>
            <div class="grid grid-cols-2 gap-4 max-w-xl mx-auto">
              <img src="${img[0]}" class="rounded h-36 w-full object-cover shadow-sm">
              <img src="${img[1]}" class="rounded h-36 w-full object-cover shadow-sm">
            </div>
          </div>
          <div class="p-6 bg-white text-center">
            <h3 class="font-bold text-slate-800 mb-1">アクセス & 営業時間</h3>
            <p class="text-xs text-slate-500 mb-4">東京都渋谷区神宮前 1-2-3 / 11:00 - 21:00 (定休日: 水曜)</p>
            <button class="w-full max-w-xs py-2.5 bg-emerald-600 text-white font-bold text-xs rounded shadow">電話・WEBで問い合わせる</button>
          </div>
        `;
      } else if (goal === 'lead') {
        note.innerText = "【B2B・リード獲得型構造】信頼性を担保する導入実績やベネフィットを上位に配置し、検討ハードルを下げるロジカルな情報設計です。";
        html = `
          <div class="p-10 bg-slate-900 text-white flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="max-w-md">
              <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">B2B Solution</span>
              <h1 class="text-2xl font-bold mt-1 mb-2">${name}</h1>
              <p class="text-xs text-slate-300 leading-relaxed">${copy}</p>
              <div class="mt-6 flex space-x-3">
                <button class="px-4 py-2 bg-indigo-600 text-xs font-semibold rounded text-white">資料をダウンロード</button>
                <button class="px-4 py-2 border border-slate-700 text-xs font-semibold rounded text-slate-300">お問い合わせ</button>
              </div>
            </div>
            <img src="${img[0]}" class="w-full md:w-64 h-40 object-cover rounded border border-slate-700 shadow">
          </div>
          <div class="p-6 bg-slate-100 text-center text-xs text-slate-600 border-b border-slate-200">
            <span>導入実績 300社突破 / 上場企業からスタートアップまで多数採用</span>
          </div>
          <div class="p-8 bg-white">
            <h3 class="text-md font-bold text-slate-800 text-center mb-6">選ばれる3つの理由</h3>
            <div class="grid grid-cols-3 gap-4 text-xs text-slate-600">
              <div class="p-4 bg-slate-50 rounded border border-slate-200"><strong class="block text-slate-800 mb-1 font-bold">01. 最短3日での導入</strong>初期負担を最小限に。</div>
              <div class="p-4 bg-slate-50 rounded border border-slate-200"><strong class="block text-slate-800 mb-1 font-bold">02. 堅牢なセキュリティ</strong>安心のデータ管理体制。</div>
              <div class="p-4 bg-slate-50 rounded border border-slate-200"><strong class="block text-slate-800 mb-1 font-bold">03. 専任ディレクター伴走</strong>運用開始後もサポート。</div>
            </div>
          </div>
        `;
      } else {
        note.innerText = "【LP・オファー強打型構造】余計なノイズを削ぎ落とし、圧倒的なベネフィット訴求と限定オファーで即座に行動（CV）を促す構成です。";
        html = `
          <div class="p-10 bg-amber-500 text-slate-950 text-center">
            <span class="bg-black text-white text-[10px] uppercase font-bold px-3 py-1 rounded-full">期間限定キャンペーン</span>
            <h1 class="text-2xl md:text-3xl font-extrabold mt-3 mb-2">${copy}</h1>
            <p class="text-xs font-semibold mb-6">【${name}】今だけの特別体験プログラム実施中</p>
            <button class="px-8 py-3 bg-black text-white font-bold text-xs rounded-full shadow-xl hover:bg-slate-800 transition">今すぐ特別価格で申し込む</button>
          </div>
          <div class="p-8 bg-white text-center">
            <h3 class="text-md font-bold text-slate-800 mb-4">プロダクトの魅力</h3>
            <img src="${img[1]}" class="w-full h-44 object-cover rounded mb-4 shadow">
            <p class="text-xs text-slate-600 max-w-md mx-auto">無駄なコストをカットし、最高の体験だけをダイレクトにお届けします。</p>
          </div>
        `;
      }

      canvas.innerHTML = html;
    }

    window.onload = () => {
      renderPreview();
    };
  </script>
</body>
</html>
